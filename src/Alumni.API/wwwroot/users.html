<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kullanıcı Yönetimi - HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f1f5f9; }
        .card { border: none; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/index.html">🎓 Alumni Platform</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="/users.html">👥 Kullanıcılar</a>
                <a class="nav-link" href="/job-postings.html">💼 İlanlar</a>
                <a class="nav-link" href="/announcements.html">📢 Duyurular</a>
                <a class="nav-link" href="/swagger">⚡ Swagger</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="alertBox"></div>

        <div class="row g-4">
            <!-- Form: Kullanıcı Ekle -->
            <div class="col-lg-4">
                <div class="card p-4">
                    <h5 class="fw-bold mb-3">➕ Yeni Kullanıcı Ekle</h5>
                    <form id="userForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Ad</label>
                            <input type="text" class="form-control" id="firstName" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Soyad</label>
                            <input type="text" class="form-control" id="lastName" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">E-Posta</label>
                            <input type="email" class="form-control" id="email" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Rol</label>
                            <select class="form-select" id="role">
                                <option value="1" selected>Alumni (Mezun)</option>
                                <option value="2">Academician (Akademisyen)</option>
                                <option value="0">Admin (Yönetici)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Kullanıcıyı Kaydet</button>
                    </form>
                </div>
            </div>

            <!-- Liste: Kullanıcılar -->
            <div class="col-lg-8">
                <div class="card p-0 overflow-hidden">
                    <div class="card-header bg-white p-3 border-bottom d-flex justify-content-between align-items-center">
                        <span class="fw-bold">Kayıtlı Kullanıcılar</span>
                        <span class="badge bg-primary" id="badgeCount">0</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Ad Soyad</th>
                                    <th>E-Posta</th>
                                    <th>Rol</th>
                                    <th>İşlem</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody">
                                <tr><td colspan="5" class="text-center p-3 text-muted">Yükleniyor...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tableBody = document.getElementById('userTableBody');
        const alertBox = document.getElementById('alertBox');

        function loadUsers() {
            fetch('/api/users')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('badgeCount').innerText = data.length;
                    tableBody.innerHTML = '';
                    if (!data.length) {
                        tableBody.innerHTML = '<tr><td colspan="5" class="text-center p-4 text-muted">Henüz kullanıcı yok.</td></tr>';
                        return;
                    }
                    data.forEach(u => {
                        tableBody.innerHTML += `
                            <tr>
                                <td class="fw-bold text-muted">#${u.id}</td>
                                <td>${u.firstName} ${u.lastName}</td>
                                <td><code>${u.email}</code></td>
                                <td><span class="badge bg-secondary">${u.role}</span></td>
                                <td>
                                    <button onclick="deleteUser(${u.id})" class="btn btn-outline-danger btn-sm">🗑️ Sil</button>
                                </td>
                            </tr>
                        `;
                    });
                })
                .catch(err => {
                    tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-danger p-3">Veriler yüklenemedi.</td></tr>';
                });
        }

        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const payload = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                role: parseInt(document.getElementById('role').value)
            };

            fetch('/api/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if (!res.ok) return res.json().then(j => { throw new Error(j.message || 'Hata oluştu'); });
                return res.json();
            })
            .then(data => {
                showAlert('success', 'Kullanıcı başarıyla eklendi!');
                document.getElementById('userForm').reset();
                loadUsers();
            })
            .catch(err => {
                showAlert('danger', err.message);
            });
        });

        function deleteUser(id) {
            if (!confirm('#' + id + ' numaralı kullanıcıyı silmek istediğinize emin misiniz?')) return;
            fetch('/api/users/' + id, { method: 'DELETE' })
                .then(res => {
                    showAlert('success', 'Kullanıcı silindi.');
                    loadUsers();
                })
                .catch(() => showAlert('danger', 'Silinirken hata oluştu.'));
        }

        function showAlert(type, msg) {
            alertBox.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show">${msg}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
        }

        loadUsers();
    </script>
</body>
</html>
