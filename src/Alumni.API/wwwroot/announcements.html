<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duyurular - HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f1f5f9; }
        .card { border: none; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/index.html">🎓 Alumni Platform</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/users.html">👥 Kullanıcılar</a>
                <a class="nav-link" href="/job-postings.html">💼 İlanlar</a>
                <a class="nav-link active" href="/announcements.html">📢 Duyurular</a>
                <a class="nav-link" href="/swagger">⚡ Swagger</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h4 class="fw-bold mb-4">📢 Güncel Duyurular (HTML UI)</h4>
        <div class="row g-4" id="annContainer">
            <div class="col-12 text-center text-muted p-4">Duyurular yükleniyor...</div>
        </div>
    </div>

    <script>
        fetch('/api/announcements')
            .then(res => res.json())
            .then(data => {
                const c = document.getElementById('annContainer');
                c.innerHTML = '';
                if (!data.length) {
                    c.innerHTML = '<div class="col-12 text-center text-muted p-5">Duyuru bulunmuyor.</div>';
                    return;
                }
                data.forEach(a => {
                    c.innerHTML += `
                        <div class="col-md-6">
                            <div class="card p-4 h-100">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="badge bg-info text-dark">${a.category}</span>
                                    <small class="text-muted">${new Date(a.createdAt).toLocaleDateString('tr-TR')}</small>
                                </div>
                                <h5 class="fw-bold mb-2">${a.title}</h5>
                                <p class="text-muted small mb-2">👤 Yayınlayan: <strong>${a.author}</strong></p>
                                <p class="text-secondary mb-0">${a.content}</p>
                            </div>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
