<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>İş İlanları - HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f1f5f9; }
        .card { border: none; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/index.html">🎓 Alumni Platform</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/users.html">👥 Kullanıcılar</a>
                <a class="nav-link active" href="/job-postings.html">💼 İlanlar</a>
                <a class="nav-link" href="/announcements.html">📢 Duyurular</a>
                <a class="nav-link" href="/swagger">⚡ Swagger</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0">💼 Güncel İş ve Staj İlanları (HTML UI)</h4>
        </div>
        <div class="row g-4" id="jobContainer">
            <div class="col-12 text-center text-muted p-4">İlanlar yükleniyor...</div>
        </div>
    </div>

    <script>
        fetch('/api/job-postings')
            .then(res => res.json())
            .then(data => {
                const c = document.getElementById('jobContainer');
                c.innerHTML = '';
                if (!data.length) {
                    c.innerHTML = '<div class="col-12 text-center text-muted p-5">Henüz ilan bulunmuyor.</div>';
                    return;
                }
                data.forEach(j => {
                    c.innerHTML += `
                        <div class="col-md-6 col-lg-4">
                            <div class="card p-4 h-100 d-flex flex-column justify-content-between">
                                <div>
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <span class="badge bg-primary">${j.employmentType}</span>
                                        <span class="badge bg-light text-dark border">${j.companyName}</span>
                                    </div>
                                    <h5 class="fw-bold mb-2">${j.title}</h5>
                                    <p class="text-muted small mb-2">📍 ${j.location}</p>
                                    <p class="small text-secondary mb-3">${j.description}</p>
                                </div>
                                <div class="pt-3 border-top d-flex justify-content-between align-items-center">
                                    <span class="fw-bold text-success small">${j.salaryRange || 'Belirtilmedi'}</span>
                                    <button class="btn btn-success btn-sm" onclick="alert('Başvuru için lütfen Razor View (/job-postings) veya API rotasını kullanın.')">Başvur</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
