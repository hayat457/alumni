<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Sayfa Bulunamadı | Alumni Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 1rem;
        }
        .error-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 3rem 2rem;
            max-width: 620px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        .error-code {
            font-size: 6rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -2px;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
        .badge-guardian {
            background-color: rgba(254, 202, 87, 0.2);
            color: #feca57;
            border: 1px solid rgba(254, 202, 87, 0.4);
            padding: 0.35rem 0.8rem;
            border-radius: 50px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="badge-guardian">
            <i class="bi bi-shield-lock-fill"></i> 404 Guardian Devrede
        </div>
        <div class="error-code">404</div>
        <h2 class="fw-bold mb-3">Aradığınız Sayfa Bulunamadı</h2>
        <p class="text-white-50 mb-4">
            Ulaşmaya çalıştığınız sayfa taşınmış, silinmiş ya da geçersiz bir adrese sahip olabilir. 
            Aşağıdaki bağlantıları kullanarak güvenli bir şekilde sisteme devam edebilirsiniz.
        </p>

        <div class="d-flex flex-wrap gap-2 justify-content-center">
            <a href="/" class="btn btn-primary px-4 py-2">
                <i class="bi bi-house-door-fill me-1"></i> Ana Sayfaya Dön
            </a>
            <a href="/job-postings" class="btn btn-outline-light px-4 py-2">
                <i class="bi bi-briefcase me-1"></i> İş İlanları
            </a>
            <a href="/users" class="btn btn-outline-light px-4 py-2">
                <i class="bi bi-people me-1"></i> Mezunlar
            </a>
            <a href="/swagger" class="btn btn-outline-warning px-4 py-2">
                <i class="bi bi-code-slash me-1"></i> Swagger API
            </a>
        </div>
    </div>
</body>
</html>
